<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Дневник целей{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7785;
      --accent: #2f6fed;
      --ok: #1f8a4c;
      --warn: #b26a00;
      --line: #e3e8ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: #1f2933;
      color: #fff;
      padding: 14px 20px;
    }
    header .inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    header .user { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    header .user form { margin: 0; }
    header button.link {
      background: none;
      border: 0;
      color: #c9d4e3;
      cursor: pointer;
      font: inherit;
      padding: 0;
    }
    header button.link:hover { color: #fff; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; font-size: 26px; }
    h2 { margin: 0 0 10px; font-size: 18px; }
    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, .08);
    }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { color: var(--warn); font-weight: 600; }
    .goals { margin: 0; padding-left: 22px; }
    .goals li { margin: 4px 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stats > div {
      background: var(--card);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, .08);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stats .num { font-size: 24px; font-weight: 700; }
    .stats span:last-child { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    form p { margin: 0 0 12px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #c7d0db;
      border-radius: 7px;
      font: inherit;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.05); }
    .helptext { color: var(--muted); font-size: 13px; display: block; margin-top: 4px; }
    .errorlist { color: #b42318; margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
    a { color: var(--accent); }
    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a href="{% url 'dashboard' %}">Дневник целей</a>
      {% if user.is_authenticated %}
        <div class="user">
          <span>{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="link">Выйти</button>
          </form>
        </div>
      {% endif %}
    </div>
  </header>

  <main>
    {% for message in messages %}
      <div class="card">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
